<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Phone Resale</title>

<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --text:var(--tg-theme-text-color,#14171a);
  --hint:var(--tg-theme-hint-color,#6b7480);
  --accent:var(--tg-theme-button-color,#2f7df6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --bad:#d64545;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:var(--tg-theme-bg-color,#17212b);
    --bg2:var(--tg-theme-secondary-bg-color,#232e3c);
    --text:var(--tg-theme-text-color,#f5f5f5);
    --hint:var(--tg-theme-hint-color,#8a99a8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:17px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
button{font:inherit;cursor:pointer}

.status{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2)}
.status .info{flex:1;min-width:0}
.money{font-size:22px;font-weight:800;line-height:1.1}
.meta{color:var(--hint);font-size:13px}
.chip{border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);
  min-height:50px;padding:0 16px;font-size:15px;font-weight:700}

.appbar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.ab{border:0;background:var(--bg2);color:var(--text);border-radius:14px;width:52px;height:52px;font-size:24px}
.ttl{flex:1;text-align:center;font-weight:700;font-size:18px}

main{flex:1;overflow-y:auto;padding:14px 14px 130px}
main.chat{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
h2{margin:0 0 4px;font-size:21px}
.hint{color:var(--hint);margin:0 0 14px;font-size:14px}
.empty{color:var(--hint);text-align:center;padding:34px 0}

.home{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:16px 0}
.app{border:0;background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:13px;padding:4px;position:relative}
.app .ic{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:38px;box-shadow:0 4px 10px #0003}
.badge{position:absolute;top:0;right:8px;background:var(--bad);color:#fff;border-radius:12px;min-width:24px;height:24px;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.evb{background:linear-gradient(90deg,#ff9a3c,#ff4d6d);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:8px;font-weight:700;font-size:15px}

.card{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:16px;padding:12px;margin-bottom:12px;
  width:100%;border:0;color:var(--text);text-align:left;min-height:84px}
.card .ct{flex:1;min-width:0}
.nm{font-weight:700}
.sub{color:var(--hint);font-size:14px}
.thumb{width:54px;flex-shrink:0}
.btn{border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);
  min-height:54px;padding:0 16px;font-size:16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.btn.danger{background:var(--bad);color:#fff}
.btn.wide{width:100%;margin-bottom:12px}
.btn.small{min-height:48px;padding:0 14px;font-size:15px}
.btns{display:flex;gap:8px;flex-shrink:0}
.card.col{flex-wrap:wrap}.card.col .btns{width:100%;flex-shrink:1}.card.col .btns .btn{flex:1;padding:0 6px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--bg2)}
.row b{font-weight:700;text-align:right}
.seg{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.seg .btn{flex:1;padding:0 6px;min-width:70px}
label.t{display:block;margin:18px 0 8px;font-weight:700}
input[type=text],input[type=password],textarea,select{width:100%;min-height:54px;padding:12px 14px;border-radius:14px;border:2px solid var(--bg2);
  background:var(--bg2);color:var(--text);font:inherit;font-size:16px;margin-bottom:10px}
textarea{min-height:64px;resize:vertical}
.tag{display:inline-block;background:var(--bad);color:#fff;border-radius:6px;font-size:11px;padding:2px 6px;margin-left:6px;vertical-align:middle}

.photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-bottom:14px}
.photos img{width:150px;flex-shrink:0;scroll-snap-align:start;background:var(--bg2);border-radius:16px;object-fit:cover;aspect-ratio:120/220}
.photos svg{width:150px;flex-shrink:0;scroll-snap-align:start;background:var(--bg2);border-radius:16px;padding:6px}
.big svg{width:170px}

.replies{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 10px}
.replies .btn{min-height:52px;font-size:14px;padding:6px 8px;line-height:1.2}
.replies .btn.full{grid-column:1/-1}
.msgs{flex:1;overflow-y:auto;padding:4px 0 130px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:16px}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-text);border-bottom-right-radius:4px}
.bubble.sel{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:4px}
.bubble .photos{margin:8px 0 0}
.bubble .photos svg{width:90px}
.note{text-align:center;color:var(--hint);font-size:14px;padding:8px}
.chathead{display:flex;justify-content:space-between;gap:8px;padding:0 2px 10px}
.chathead b{font-size:15px}

.scene{background:var(--bg2);border-radius:16px;padding:14px;margin-bottom:14px}
.insp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.res{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px}

.frame{border-radius:34px;padding:22px 16px;margin:4px auto 16px;max-width:260px;min-height:380px;
  box-shadow:0 8px 24px #0004,inset 0 0 0 6px #111}
.frame .home{padding:8px 0;gap:14px 4px}
.frame .app{color:#fff;text-shadow:0 1px 3px #0008}
.frame .app .ic{width:64px;height:64px;font-size:32px}
.clock{text-align:center;color:#fff;font-size:34px;font-weight:700;text-shadow:0 1px 4px #0006}

#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#000d;color:#fff;
  padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:88%;text-align:center;z-index:30}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.modal{background:var(--bg);border-radius:18px;padding:20px;max-width:380px;width:100%}
.modal p{margin:8px 0 14px;white-space:pre-wrap}
.modal .btns{justify-content:flex-end}
.pill{display:inline-block;background:var(--bg2);border-radius:10px;padding:6px 10px;font-weight:700;margin-bottom:12px}

#wipe{position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
#wipe .wtop{position:absolute;top:0;left:0;right:0;padding:16px 8px;background:#d10000;font-size:34px;font-weight:900;letter-spacing:2px}
#wipe .wnum{font-size:170px;font-weight:900;line-height:1}
#wipe.red{background:#c00000e6;animation:redpulse .5s ease-in-out infinite alternate}
@keyframes redpulse{from{background:#8a0000e6}to{background:#ff1a1aee}}
#wipe.boom{background:#fff;color:#000;animation:wflash .25s steps(2) 4}
#wipe.boom .wnum{animation:wboom 1.6s ease-out forwards}
@keyframes wflash{50%{background:#ff3b00}}
@keyframes wboom{from{transform:scale(.4)}to{transform:scale(2.4)}}
body.shake #app{animation:shake .08s linear infinite}
@keyframes shake{0%{transform:translate(4px,3px)}50%{transform:translate(-4px,-3px)}100%{transform:translate(3px,-4px)}}
.avatar{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--bg2);flex-shrink:0;overflow:hidden}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 14px}
.emojis button{border:0;background:var(--bg2);border-radius:14px;font-size:28px;min-height:54px}
.emojis button.on{box-shadow:inset 0 0 0 3px var(--accent)}
.app.soon{opacity:.45;filter:grayscale(1)}
.app small{color:var(--hint);font-size:11px;margin-top:-6px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.fx span{position:absolute;top:-60px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
body.disco #app{animation:disco .7s linear infinite}
@keyframes disco{0%{filter:hue-rotate(0deg) saturate(1.6)}100%{filter:hue-rotate(360deg) saturate(1.6)}}
</style>

/* ---------- случайность и состояние ---------- */
const rnd = n => Math.floor(Math.random()*n);
const between = (a,b) => a + rnd(b-a+1);
const pick = arr => arr[rnd(arr.length)];
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// язык берётся из Телеграма пользователя; незнакомые языки -> английский
function detectLang(){
  let c = "en";
  try { c = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "en"; } catch(e){}
  c = String(c).slice(0,2).toLowerCase();
  if (c === "be") c = "ru";
  return I[c] ? c : "en";
}
function mkListing(S){
  const m = rnd(PHONES.length-1), c = rnd(4);
  const base = PHONES[m][1]*COND[c];
  const ask = Math.max(5, Math.round(base*(0.8+Math.random()*0.35)));
  const min = Math.max(3, Math.round(ask*(0.78+Math.random()*0.17)));
  const ob = Math.random()>0.35, back = Math.random()<0.25, cam = Math.random()<0.17, imeiBad = Math.random()<0.15;
  const dm_ = defMul({ob,back,cam,imeiBad});
  const ask2 = Math.max(5, Math.round(ask*Math.min(1, dm_*1.12)));
  return {id:S.nextId++, m, c, ask:ask2, min:Math.max(3, Math.round(ask2*(0.78+Math.random()*0.17))), ob, back, cam, imeiBad, seller:pick(NAMES), bat:between(BAT[c][0],BAT[c][1]),
    gb:pick([64,128,256]), imei:String(1e14+Math.floor(Math.random()*9e14)), seed:rnd(1e9),
    chat:{msgs:[], price:ask2, patience:3, state:"idle"}, insp:{}};
}
function rollDay(S, first){
  if (!first) S.day++;
  S.demand = Math.round((0.8+Math.random()*0.5)*100)/100;
  S.listings = [];
  for (let i=0;i<8;i++) S.listings.push(mkListing(S));
}
function fresh(lang, keepSet){
  const S = {lang:lang||detectLang(), langSet:!!keepSet, money:START_MONEY, day:1, demand:1, inv:[], listings:[], inf:false, nextId:1, seen:{}, wipes:{}, profile:null, parts:{}, lastActive:Date.now()};
  rollDay(S,true);
  return S;
}
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.inv) && Array.isArray(s.listings) && I[s.lang]){
        s.seen = s.seen || {}; s.wipes = s.wipes || {}; s.parts = s.parts || {};
        if (!s.langSet) s.lang = detectLang();   // пока язык не выбран вручную, следуем языку Телеграма
        return s;
      }
    }
  } catch(e){}
  return fresh();
}

function playFx(name, secs){
  if (!name || name==="none") return;
  const dur = (secs>0 ? secs : 6)*1000;
  if (name === "disco"){ document.body.classList.add("disco"); setTimeout(()=>document.body.classList.remove("disco"), dur); return; }
  const em = name==="rain" ? ["🪙","💸","📱","💰"] : ["🎉","🎊","✨","🥳"];
  const box = document.createElement("div"); box.className = "fx"; document.body.appendChild(box);
  const end = Date.now()+dur;
  const spawn = ()=>{
    for (let i=0;i<6;i++){
      const sp = document.createElement("span"); sp.textContent = pick(em);
      sp.style.left = Math.random()*100+"%"; sp.style.fontSize = (20+Math.random()*24)+"px";
      sp.style.animationDuration = (2+Math.random()*3)+"s"; box.appendChild(sp); setTimeout(()=>sp.remove(), 5500);
    }
    if (Date.now() < end) setTimeout(spawn, 350); else setTimeout(()=>box.remove(), 6000);
  };
  spawn();
}

let lastSig = "";
async function pullEvents(){
  const url = LIVE_URL ? LIVE_URL.replace(/\/$/,"")+"/live.json" : "events.json";
  try {
    const r = await fetch(url+"?t="+Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const j = await r.json();
    EVPOSTS = (j && Array.isArray(j.posts)) ? j.posts : [];
    if (!baselineSet){ EVPOSTS.forEach(p=>baseline.add(p.id)); baselineSet = true; }
    EVPOSTS.forEach(p=>{ if (!baseline.has(p.id) && !RECV[rk(p)]) RECV[rk(p)] = Date.now(); });
    checkWipes();   // всё, что уже было при входе
    queuePosts();
    const sig = JSON.stringify(active().map(p=>p.id+p.on))+(modal?modal.id:"");
    if (sig !== lastSig){ lastSig = sig; render(); }
  } catch(e){}
}

async function sha256hex(str){
  if (!(window.crypto && crypto.subtle)) return "";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function handleFile(f){
  if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const c = document.createElement("canvas"); c.width = c.height = 160;
      const g = c.getContext("2d"), m = Math.min(im.width, im.height);
      g.drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, 0, 0, 160, 160);
      OB.avatar = c.toDataURL("image/jpeg", 0.82); render();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

  S = fresh(S.lang, S.langSet); S.seen = keep.seen; S.wipes = keep.wipes; S.profile = keep.profile;   // язык сохраняем, остальное с нуля

function startWipe(p, preview){
  if (wipeRun) return; wipeRun = true;
  const el = document.createElement("div"); el.id = "wipe";
  el.innerHTML = `<div class="wtop">${t("wipe_title")}</div><div class="wnum"></div>`;
  document.body.appendChild(el);
  const num = el.querySelector(".wnum"); let n = 10;
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("warning"); } catch(e){}
  const boom = ()=>{
    el.className = "boom"; num.textContent = "💥"; el.querySelector(".wtop").textContent = t("wipe_boom");
    document.body.classList.add("shake");
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error"); } catch(e){}
    setTimeout(()=>{
      document.body.classList.remove("shake"); el.remove(); wipeRun = false;
      if (preview){ S.wipes[p.id] = true; save(); }      // у владельца только показ, прогресс не стирается
      else { doWipe(p.id); toast(t("wipe_done")); }

  };
  const tick = ()=>{
    num.textContent = n; el.classList.toggle("red", n <= 5);   // 10-6 просто счёт, 5-0 всё красное
    if (n > 0){ n--; setTimeout(tick, 1000); } else setTimeout(boom, 1000);
  };
  tick();
}
function checkWipes(){
  if (wipeRun) return;
  for (const p of EVPOSTS){
    if (p.effect !== "wipe" || !p.on || S.wipes[p.id]) continue;
    if (baseline.has(p.id)){          // вайп был, пока игрока не было в игре: стираем при входе
      if ((p.at||0) > PREV_ACTIVE){ doWipe(p.id); render(); toast(t("wipe_done")); }
      else { S.wipes[p.id] = true; save(); }
    } else { startWipe(p, false); return; }   // вайп запущен при игроке: отсчёт 10 секунд
  }
}

function cracks(R, c, x0, y0, w, h){
  let s = "";
  if (c === 0){
    const ox = x0+w*(0.3+R()*0.4), oy = y0+h*(0.3+R()*0.4);
    for (let i=0;i<10;i++){
      const a = R()*Math.PI*2, len = 25+R()*80;
      const mx = ox+Math.cos(a)*len*0.5+(R()-0.5)*8, my = oy+Math.sin(a)*len*0.5+(R()-0.5)*8;
      const ex = ox+Math.cos(a)*len, ey = oy+Math.sin(a)*len;
      s += `<polyline points="${ox},${oy} ${mx},${my} ${ex},${ey}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width=".9"/>`;
    }
    s += `<circle cx="${ox}" cy="${oy}" r="3" fill="#fff" fill-opacity=".5"/>`;
  } else if (c === 1){
    for (let i=0;i<4;i++){
      const x = x0+R()*w*0.8, y = y0+R()*h*0.8;
      s += `<line x1="${x}" y1="${y}" x2="${x+10+R()*18}" y2="${y+R()*14-7}" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/>`;
    }
  } else if (c === 2){
    const x = x0+R()*w*0.6, y = y0+R()*h*0.6;
    s += `<line x1="${x}" y1="${y}" x2="${x+16}" y2="${y+6}" stroke="#fff" stroke-opacity=".35" stroke-width=".6"/>`;
  }
  return s;
}
function lens(x, y, r, id){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#a9afb6"/><circle cx="${x}" cy="${y}" r="${r-1.3}" fill="#17171b"/>
    <circle cx="${x}" cy="${y}" r="${r*0.64}" fill="url(#${id}l)"/><circle cx="${x-r*0.28}" cy="${y-r*0.28}" r="${r*0.2}" fill="#fff" fill-opacity=".8"/>`;
}
const mod = (x,y,w,h,rx) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="#0a0a0f" fill-opacity=".4" stroke="#fff" stroke-opacity=".4" stroke-width=".9"/>`;

function frontInner(it, uid){
  const R = rng(it.seed+1), sp = specOf(it.m);
  let s = `<defs>
    <linearGradient id="${uid}w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${sp.wall[0]}"/><stop offset="1" stop-color="${sp.wall[1]}"/></linearGradient>
    <linearGradient id="${uid}f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${sp.frame}"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="${sp.frame}"/></linearGradient>
    <linearGradient id="${uid}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="${uid}c"><rect x="11" y="9" width="98" height="202" rx="14"/></clipPath></defs>`;
  s += `<rect x="3" y="52" width="3" height="16" rx="1.5" fill="${sp.frame}"/><rect x="3" y="74" width="3" height="16" rx="1.5" fill="${sp.frame}"/><rect x="114" y="66" width="3" height="26" rx="1.5" fill="${sp.frame}"/>`;
  s += `<rect x="5" y="3" width="110" height="214" rx="21" fill="url(#${uid}f)"/><rect x="8" y="6" width="104" height="208" rx="18" fill="#08080b"/>`;
  s += `<rect x="11" y="9" width="98" height="202" rx="14" fill="url(#${uid}w)"/><g clip-path="url(#${uid}c)">`;
  s += `<circle cx="92" cy="40" r="46" fill="#fff" fill-opacity=".12"/><circle cx="20" cy="172" r="52" fill="#000" fill-opacity=".14"/>`;
  s += `<text x="20" y="22" font-size="7" font-family="sans-serif" font-weight="700" fill="#fff">12:30</text>
    <rect x="86" y="16" width="13" height="6" rx="1.8" fill="none" stroke="#fff" stroke-width=".8"/><rect x="87.3" y="17.3" width="8" height="3.4" rx=".8" fill="#fff"/>
    <text x="60" y="74" text-anchor="middle" font-size="26" font-family="sans-serif" font-weight="300" fill="#fff">12:30</text>
    <text x="60" y="86" text-anchor="middle" font-size="6.5" font-family="sans-serif" fill="#fff" fill-opacity=".85">Mon, 9 Nov</text>`;
  const pal = ["#ff6b6b","#feca57","#48dbfb","#1dd1a1","#5f27cd","#ff9ff3","#54a0ff","#c8d6e5"];
  for (let r=0;r<3;r++) for (let c=0;c<4;c++) s += `<rect x="${17+c*22}" y="${104+r*26}" width="16" height="16" rx="4.5" fill="${pal[Math.floor(R()*pal.length)]}"/>`;
  for (let c=0;c<4;c++) s += `<rect x="${17+c*22}" y="188" width="16" height="16" rx="4.5" fill="#fff" fill-opacity=".85"/>`;
  s += cracks(R, it.c, 11, 9, 98, 202);
  s += `<polygon points="11,9 84,9 11,100" fill="url(#${uid}g)"${it.c===3?"":' fill-opacity=".6"'}/></g>`;
  if (sp.fr === "notch") s += `<path d="M42 9 h36 v3 q0 7 -7 7 h-22 q-7 0 -7 -7z" fill="#08080b"/>`;
  else if (sp.fr === "island") s += `<rect x="45" y="13" width="30" height="9" rx="4.5" fill="#000"/>`;
  else s += `<circle cx="60" cy="17" r="3.2" fill="#000"/><circle cx="59" cy="16" r="1" fill="#2a3a5a"/>`;
  return s;
}
function backInner(it, uid){
  const R = rng(it.seed+7), sp = specOf(it.m), id = uid;
  let s = `<defs>
    <radialGradient id="${id}l" cx=".4" cy=".4"><stop offset="0" stop-color="#3f4f86"/><stop offset="1" stop-color="#04050c"/></radialGradient>
    <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
    <clipPath id="${id}bc"><rect x="7" y="5" width="106" height="210" rx="19"/></clipPath></defs>`;
  s += `<rect x="3" y="52" width="3" height="16" rx="1.5" fill="${sp.frame}"/><rect x="114" y="66" width="3" height="26" rx="1.5" fill="${sp.frame}"/><rect x="114" y="98" width="3" height="16" rx="1.5" fill="${sp.frame}"/>`;
  s += `<rect x="5" y="3" width="110" height="214" rx="21" fill="${sp.frame}"/><rect x="7" y="5" width="106" height="210" rx="19" fill="${sp.body}"/>`;
  s += `<g clip-path="url(#${id}bc)">`;
  switch (sp.bk){
    case "sq2": s += mod(14,12,46,46,12)+lens(28,26,8,id)+lens(28,44,8,id)+`<circle cx="49" cy="22" r="3" fill="#f7e9b0"/><circle cx="49" cy="34" r="1.4" fill="#222"/>`; break;
    case "diag2": s += mod(14,12,46,46,12)+lens(28,26,8.5,id)+lens(46,44,8.5,id)+`<circle cx="47" cy="23" r="3" fill="#f7e9b0"/>`; break;
    case "sq3": s += mod(14,12,52,52,13)+lens(29,27,8.5,id)+lens(29,48,8.5,id)+lens(50,37,8.5,id)+`<circle cx="53" cy="21" r="2.6" fill="#f7e9b0"/><circle cx="53" cy="53" r="2" fill="#222"/>`; break;
    case "vert3": s += lens(24,24,8,id)+lens(24,46,8,id)+lens(24,68,8,id)+`<circle cx="44" cy="26" r="3" fill="#f7e9b0"/>`; break;
    case "contour3": s += `<path d="M7 18 Q7 10 15 10 H66 Q82 10 82 26 V56 Q82 72 66 72 H7 Z" fill="${sp.frame}"/>`+lens(26,27,9,id)+lens(26,53,9,id)+lens(55,40,9,id)+`<circle cx="70" cy="20" r="2.6" fill="#f7e9b0"/>`; break;
    case "bar2": s += `<rect x="5" y="42" width="110" height="26" fill="#15171b"/><rect x="5" y="42" width="110" height="26" fill="url(#${id}s)" fill-opacity=".6"/>`+lens(38,55,8.5,id)+lens(64,55,8.5,id)+`<circle cx="88" cy="55" r="3.6" fill="#eee"/><circle cx="100" cy="55" r="2" fill="#333"/>`; break;
    case "sqR": s += mod(10,12,52,52,10)+lens(26,28,8,id)+lens(26,48,8,id)+lens(46,38,8,id)+`<circle cx="52" cy="22" r="2.6" fill="#f7e9b0"/>`; break;
    case "sqBig": s += mod(10,10,64,64,14)+lens(30,30,12,id)+lens(30,56,12,id)+lens(56,43,12,id)+`<circle cx="66" cy="18" r="3" fill="#f7e9b0"/>`; break;
    case "circ": s += `<circle cx="42" cy="44" r="32" fill="#0a0a0f" fill-opacity=".45"/><circle cx="42" cy="44" r="32" fill="none" stroke="${sp.frame}" stroke-width="3"/>`+lens(30,32,9,id)+lens(54,32,9,id)+lens(42,56,9,id)+`<circle cx="84" cy="22" r="3" fill="#f7e9b0"/>`; break;
    case "sqOp": s += mod(10,10,58,58,16)+lens(27,27,9,id)+lens(27,51,9,id)+lens(51,39,9,id)+`<circle cx="57" cy="20" r="2.8" fill="#f7e9b0"/>`; break;
    case "glyph": s += `<circle cx="60" cy="122" r="30" fill="none" stroke="#9aa0a8" stroke-width="2"/><circle cx="60" cy="122" r="18" fill="none" stroke="#9aa0a8" stroke-width="2"/><circle cx="60" cy="122" r="6" fill="#9aa0a8"/>
      <path d="M22 168 H98 M22 180 H78" stroke="#b9bec6" stroke-width="2" fill="none"/><path d="M18 92 Q60 80 102 92" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>`+lens(30,28,9,id)+lens(30,50,9,id)+`<circle cx="98" cy="24" r="2" fill="#e33"/>`; break;
  }
  s += cracks(R, it.c, 7, 5, 106, 210);
  s += `<rect x="7" y="5" width="106" height="210" fill="url(#${id}s)"/></g>`;
  return s;
}
function phoneSvg(it, kind){
  const uid = "p"+it.seed+"k"+kind, head = `<svg viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">`;
  if (kind === 0) return head + frontInner(it, uid) + `</svg>`;
  if (kind === 1) return head + backInner(it, uid) + `</svg>`;
  return head + `<rect width="120" height="220" fill="#00000010"/><ellipse cx="62" cy="206" rx="46" ry="6" fill="#0004"/>
    <g transform="rotate(-10 60 110) translate(11 12) scale(.82)">${frontInner(it, uid)}</g>
    <rect x="20" y="184" width="80" height="22" rx="6" fill="#fff"/><text x="60" y="199" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#111" font-weight="700">${pname(it)}</text></svg>`;
}

  const secs = Math.max(0, +o.secs || 0);
  return {id:"p"+Date.now()+rnd(999), at:Date.now(), on:true, text:o.text, effect:o.effect||"none", value:+o.value||0, secs,

/* ---------- чат ---------- */
function say(l, from, text, photos){ l.chat.msgs.push({from, text, photos:!!photos}); }
function chatAct(l, a, f){
  const ch = l.chat;
  if (ch.state === "closed" || ch.state === "bought") return;
  if (a === "hello"){ say(l,"me",t("q_hello")); say(l,"sel",pick(t("s_hello"))); ch.state = "open"; }
  else if (a === "photos"){ say(l,"me",t("q_photos")); say(l,"sel",t("s_photos"),true); ch.state = "open"; }
  else if (a === "cond"){ say(l,"me",t("q_cond")); say(l,"sel",t("s_cond")[l.c]); ch.state = "open"; }
  else if (a === "haggle"){
    ch.state = "open";
    const offer = Math.round(ch.price*f);
    say(l,"me",t("q_haggle",{p:bf(offer)}));
    if (offer >= l.min){ ch.price = offer; say(l,"sel",t("s_deal",{p:bf(offer)})); }
    else {
      ch.patience--;
      if (ch.patience <= 0){ say(l,"sel",t("s_angry")); ch.state = "closed"; }
      else { const counter = Math.max(l.min, Math.round((ch.price+offer)/2)); ch.price = counter; say(l,"sel",t("s_counter",{p:bf(counter)})); }
    }
  }
  else if (a === "meet"){ say(l,"me",t("q_meet")); say(l,"sel",t("s_meet",{p:bf(ch.price)})); ch.state = "agreed"; }
  else if (a === "bye"){ say(l,"me",t("q_bye")); say(l,"sel",t("s_bye")); ch.state = "closed"; }
}
function newPhone(m, c, paid){
  return {id:S.nextId++, m, c, bat:between(BAT[c][0],BAT[c][1]), gb:pick([64,128,256]),
    imei:String(1e14+Math.floor(Math.random()*9e14)), seed:rnd(1e9), paid:paid||0, ob:true, back:false, cam:false, imeiBad:false};
}

/* ---------- действия ---------- */
function act(a, d){
  switch(a){
    case "go": go(d.v, {lid:d.lid?+d.lid:nav.lid, pid:d.pid?+d.pid:nav.pid, dev:d.dev?+d.dev:undefined}); break;
    case "back": back(); break;
    case "home": home(); break;
    case "next": rollDay(S); save(); stack = []; if (["listing","chat","meet","ads","chats"].includes(nav.view)) nav = {view:"ads"}; toast(`${t("newDay")} ×${demandNow()}`); break;
    case "chat": { const l = findL(+d.lid); if (!l) break; go("chat",{lid:l.id}); break; }
    case "c": { const l = findL(nav.lid); if (l){ chatAct(l, d.a, +d.f); save(); } break; }
    case "insp": { const l = findL(nav.lid); if (l){ l.insp = l.insp||{}; l.insp[d.k] = true; save(); } break; }
    case "buy": {
      const l = findL(+d.lid); if (!l) break;
      const price = Math.max(1, Math.round(l.chat.price*pm()));
      if (!S.inf && S.money < price){ toast(t("noMoney")); return; }
      if (!S.inf) S.money -= price;
      S.inv.push({id:l.id,m:l.m,c:l.c,bat:l.bat,gb:l.gb,imei:l.imei,seed:l.seed,paid:price,ob:l.ob,back:l.back,cam:l.cam,imeiBad:l.imeiBad});
      S.listings = S.listings.filter(x=>x.id!==l.id); save();
      toast(`${t("bought")}: ${pname(l)}`); stack = []; nav = {view:"stock"}; break;
    }
    case "leave": toast(t("left")); back(); break;
    case "sell": {
      const i = S.inv.findIndex(p=>p.id===+d.pid); if (i<0) break;
      const pr = sellPrice(S.inv[i]); S.money += pr; S.inv.splice(i,1); save();
      toast(`${t("sold")} ${fmt(pr)}`); if (nav.view==="phone"||nav.view==="gallery"){ stack=[]; nav={view:"stock"}; } break;
    }
    case "sellall": {
      const n = S.inv.length, tot = S.inv.reduce((s,x)=>s+sellPrice(x),0);
      S.inv = []; S.money += tot; save(); toast(`${t("soldAll")} ${n} · ${fmt(tot)}`); break;
    }
    case "lang": S.lang = d.l; S.langSet = true; save(); break;   // язык = валюта
    case "promo": {
      const inp = document.getElementById("promoIn");
      const code = inp ? inp.value.trim() : "";
      if (code === PROMO){ toast(t("promoOk")); go("admin"); }
      else if (code === OWNER_CODE){ if (!OWPOSTS.length) OWPOSTS = EVPOSTS.slice(); go("owner"); }
      else { toast(t("promoBad")); return; }
      break;
    }
    case "resetask": askReset = true; break;
    case "resetno": askReset = false; break;
    case "resetyes": { const k = {seen:S.seen, wipes:S.wipes, profile:S.profile}; S = fresh(S.lang, S.langSet); S.seen = k.seen; S.wipes = k.wipes; S.profile = k.profile; } save(); askReset = false; stack = []; nav = {view:"home"}; toast(t("resetDone")); break;
    case "adm": {
      if (nav.view !== "admin") break;
      if (d.a === "all"){ PHONES.forEach((_,m)=>S.inv.push(newPhone(m,3))); toast(`${t("given")}: ${PHONES.length}`); }
      else if (d.a === "inf") S.inf = !S.inf;
      else if (d.a === "cash"){ S.money += 1000000; toast(t("cashOk")); }
      save(); break;
    }
    case "soon": toast(t("pm_toast")); return;
    case "own_buy": {
      const k = d.k, i = +d.i, pr = partPrice(k,i);
      if (!PARTS[k] || !(i>=0 && i<3)) return;
      if (!S.inf && S.money < pr){ toast(t("noMoney")); return; }
      if (!S.inf) S.money -= pr;
      S.parts[k+i] = (S.parts[k+i]||0)+1; save(); break;
    }
    case "own_build": {
      const {sel, miss} = ownBest();
      if (miss.length){ toast(t("own_missing")+miss.join(", ")); return; }
      PKEYS.forEach(k=>S.parts[k+sel[k]]--);
      const val = ownValue(sel), nm = (OWN.name||"").trim() || "QOOX One";
      S.inv.push({id:S.nextId++, m:OWN_LOOK, c:3, bat:100, gb:128, imei:String(1e14+Math.floor(Math.random()*9e14)), seed:rnd(1e9), paid:0,
        ob:true, back:false, cam:false, imeiBad:false, custom:{name:nm, val}});
      OWN.name = ""; save(); toast(t("own_built")); break;
    }
    case "ws": {
      const p = findP(nav.pid); if (!p) return; const k = d.k;
      if (k === "open"){ p.open = true; save(); break; }
      if (k === "close"){ p.open = false; save(); break; }
      const needOpen = ["batOrig","batCopy","cam","imei"].includes(k);
      if (needOpen && !p.open){ toast(t("ws_needOpen")); return; }
      if (k==="scr" && p.c>=2){ toast(t("ws_screenGood")); return; }
      if (k==="back" && !p.back){ toast(t("ws_noNeed")); return; }
      if (k==="cam" && !p.cam){ toast(t("ws_noNeed")); return; }
      if (k==="imei" && !p.imeiBad){ toast(t("ws_noNeed")); return; }
      const cost = wsCost(p,k);
      if (!S.inf && S.money < cost){ toast(t("noMoney")); return; }
      if (!S.inf) S.money -= cost;
      if (k==="scr") p.c = 2;
      else if (k==="back") p.back = false;
      else if (k==="batOrig"){ p.bat = 100; p.ob = true; }
      else if (k==="batCopy"){ p.bat = between(85,95); p.ob = false; }
      else if (k==="cam") p.cam = false;
      else if (k==="imei") p.imeiBad = false;
      save(); toast(t("ws_done")); break;
    }
    case "ob_pick": { const f = document.getElementById("obFile"); if (f) f.click(); return; }
    case "ob_tg": OB.avatar = tgUser().photo_url || OB.avatar; break;
    case "ob_emoji": OB.avatar = "emoji:"+d.e; break;
    case "ob_save": saveProfile().then(render); return;
    case "edit_profile": startOnboard(true); go("onboard"); break;
    case "closemodal": {
      if (!modal) break;
      const p = modal; S.seen[p.id] = true;
      if (p.effect === "gift") S.money += (+p.value||0);
      if (p.effect === "phone") S.inv.push(newPhone(rnd(PHONES.length-1), 3));
      modal = null; save(); queuePosts(); break;
    }
    /* --- владелец --- */
    case "ow_preset": {
      const pr = PRESETS[+d.i];
      if (pr.effect === "wipe"){ askWipe = true; wipePreset = pr; break; }   // вайп только после подтверждения
      owPush(mkPost(pr)); publish().then(render); break;
    }
    case "wipeno": askWipe = false; break;
    case "wipeyes": {
      askWipe = false; const post = mkPost(wipePreset);
      OWPOSTS.push(post); S.seen[post.id] = true; S.wipes[post.id] = true; save();
      publish().then(render); startWipe(post, true); break;
    }
    case "ow_add": {
      const text = {ru:OW.ru.trim(),uk:OW.uk.trim(),kk:OW.kk.trim(),en:OW.en.trim()};
      if (!text.ru && !text.uk && !text.kk && !text.en && OW.effect==="none" && OW.fx==="none"){ toast("Напиши текст или выбери эффект"); return; }
      owPush(mkPost({text, effect:OW.effect, value:OW.value, secs:OW.secs, fx:OW.fx, online:OW.online==="1"}));
      OW.ru = OW.uk = OW.kk = OW.en = "";
      publish().then(render); break;
    }
    case "ow_toggle": {
      const p = OWPOSTS.find(x=>x.id===d.id); if (!p) break;
      p.on = !p.on; if (p.on) p.rev = (p.rev||0)+1; const sc = p.secs!==undefined ? p.secs : (p.hours||0)*3600; if (p.on && sc>0) p.until = new Date(Date.now()+sc*1000).toISOString();
      publish().then(render); break;
    }
    case "ow_del": OWPOSTS = OWPOSTS.filter(x=>x.id!==d.id); publish().then(render); break;
    case "ow_secret": {
      const v = (document.getElementById("owSecret")||{}).value || "";
      if (v.trim()){ try { localStorage.setItem("owner_secret", v.trim()); } catch(e){} toast("Секрет сохранён"); }
      break;
    }
    case "ow_reserve": {
      const sec = owSecret(); if (!sec){ toast("Сначала введи секрет базы"); return; }
      fetch(LIVE_URL.replace(/\/$/,"")+"/nicks/"+encodeURIComponent(OWNER_NICK.toLowerCase())+".json?auth="+encodeURIComponent(sec),
        {method:"PUT", body:JSON.stringify({uid:"owner", t:{".sv":"timestamp"}})})
        .then(r=>toast(r.ok ? "🔒 Ник QOOX зарезервирован в базе" : "❌ Ошибка "+r.status), ()=>toast("❌ Нет связи с базой"));
      return;
    }
    case "ow_secretclear": try { localStorage.removeItem("owner_secret"); } catch(e){} break;
    case "ow_copy": {
      const ta = document.getElementById("owJson");
      try { navigator.clipboard.writeText(owJson()).then(()=>toast("Скопировано"), ()=>{ ta.select(); document.execCommand("copy"); toast("Скопировано"); }); }
      catch(e){ if (ta){ ta.select(); try{ document.execCommand("copy"); toast("Скопировано"); }catch(_){ toast("Выдели текст и скопируй"); } } }
      return;
    }
  }
  render();
}
$app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act, b.dataset);
});
$app.addEventListener("keydown", e=>{
  if (e.key === "Enter" && e.target.id === "promoIn") act("promo", {});
});
$app.addEventListener("input", e=>{
  const d = e.target.dataset||{};
  if (d.ow) OW[d.ow] = e.target.value;
  if (d.ob) OB[d.ob] = e.target.value;
  if (d.own) OWN[d.own] = e.target.value;
  if (d.ob === "nick"){ const bx = document.getElementById("ownerBox"); if (bx) bx.style.display = e.target.value.trim().toLowerCase()===OWNER_NICK.toLowerCase() ? "block" : "none"; }
});
$app.addEventListener("change", e=>{ if (e.target.id === "obFile") handleFile(e.target.files[0]); });

if (!S.profile) startOnboard(false);
render();
pullEvents();
setInterval(pullEvents, LIVE_URL ? 5000 : 60000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) pullEvents(); });
</script>
</body>
</html>
